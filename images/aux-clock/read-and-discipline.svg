<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-label="AUX 读钟路径与校准路径"><title>AUX 读钟路径与校准路径</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#22354a} .title{font-size:27px;font-weight:700} .label{font-size:21px} .small{font-size:18px;fill:#536779}</style><rect width="1000" height="610" rx="16" fill="#f8fafc"/><text x="35" y="48" class="title" text-anchor="start">读钟与校准：共享状态，分离访问路径</text><rect x="35" y="110" width="220" height="85" rx="12" fill="#eaf2fc" stroke="#6795ca" stroke-width="2"/><text x="145.0" y="145.0" class="label" text-anchor="middle">应用</text><text x="145.0" y="174.0" class="label" text-anchor="middle">clock_gettime(AUX0)</text><rect x="365" y="110" width="250" height="85" rx="12" fill="#eaf2fc" stroke="#6795ca" stroke-width="2"/><text x="490.0" y="145.0" class="label" text-anchor="middle">vDSO 读钟</text><text x="490.0" y="174.0" class="label" text-anchor="middle">基准 + cycle 换算</text><rect x="730" y="110" width="235" height="85" rx="12" fill="#eaf2fc" stroke="#6795ca" stroke-width="2"/><text x="847.5" y="145.0" class="label" text-anchor="middle">CPU clocksource</text><text x="847.5" y="174.0" class="label" text-anchor="middle">当前 cycle</text><polyline points="255,152 365,152" fill="none" stroke="#52799d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="615,152 730,152" fill="none" stroke="#52799d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="490" y="90" class="small" text-anchor="middle">用户态快速读取</text><rect x="365" y="365" width="250" height="100" rx="12" fill="#eaf2fc" stroke="#6795ca" stroke-width="2"/><text x="490.0" y="407.5" class="label" text-anchor="middle">AUX timekeeper</text><text x="490.0" y="436.5" class="label" text-anchor="middle">base / mult / offset</text><polyline points="490,365 490,195" fill="none" stroke="#c28b38" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="595" y="285" class="small" text-anchor="middle">发布 vDSO 快照</text><rect x="35" y="365" width="220" height="100" rx="12" fill="#fff1df" stroke="#d69b4c" stroke-width="2"/><text x="145.0" y="407.5" class="label" text-anchor="middle">同步 daemon</text><text x="145.0" y="436.5" class="label" text-anchor="middle">clock_adjtime(AUX0)</text><polyline points="255,415 365,415" fill="none" stroke="#c28b38" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="185" y="505" class="small" text-anchor="middle">只调整选中的 AUX</text><rect x="35" y="235" width="220" height="75" rx="12" fill="#eaf2fc" stroke="#6795ca" stroke-width="2"/><text x="145.0" y="279.5" class="label" text-anchor="middle">系统调用回退</text><polyline points="145,195 145,235" fill="none" stroke="#52799d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="255,272 300,272 300,385 365,385" fill="none" stroke="#52799d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="560" class="small" text-anchor="middle">vDSO 不可用时，经内核 AUX 读取接口返回时间</text></svg>